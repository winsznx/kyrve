[profile.default]
src = "contracts"
# Rooted at `contracts` so both contracts/test (Kyrve unit tests) and
# contracts/integration/test (tests against real unmodified Midnight) are discovered.
test = "contracts"
script = "contracts/script"
out = "out"
libs = ["vendor/midnight/lib"]

# Matches the pinned Midnight release exactly so runtime-bytecode comparison stays meaningful.
# Changing any of these five invalidates deployments/*/bytecode-lock.json. PRD v1.1 A-1.
via_ir = true
optimizer = true
optimizer_runs = 466
bytecode_hash = "none"
evm_version = "osaka"
solc_version = "0.8.34"

remappings = [
    "forge-std/=vendor/midnight/lib/forge-std/src/",
    "midnight/=vendor/midnight/src/",
]

# Narrow, explicit write scope: fixtures and generated artifacts only. Never the repository root.
fs_permissions = [
    { access = "read-write", path = "./packages/quote-math/test/fixtures" },
    { access = "read-write", path = "./packages/generated/abi" },
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./vendor/midnight" },
]

[profile.default.fmt]
wrap_comments = true

[profile.ci]
verbosity = 3
fuzz = { runs = 1024 }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
