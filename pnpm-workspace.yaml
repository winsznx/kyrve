# `spikes/*` are deliberately excluded. They are the frozen Day 0 evidence artifacts and
# reproduce with their own lockfiles exactly as `docs/day0/` records. Phase 1 promotes their
# proven behaviour into `packages/*` and `workers/*` rather than absorbing them.
packages:
  - packages/*
  - workers/*
  - apps/*
  - confidential

onlyBuiltDependencies:
  - esbuild
  - workerd

# Transitive advisories in the Hardhat 3 toolchain the confidential workspace needs to drive the
# real Nox stack. Every one of these arrives through `hardhat` or
# `@nomicfoundation/hardhat-toolbox-viem`, is development-only, and reaches no bundle and no
# deployed artifact — but "it is only a dev dependency" is how a supply-chain compromise gets in,
# and every one of these has a published fix. So they are pulled forward rather than excused.
#
# Each entry names the advisories it closes. Versions are EXACT, like every other pin in this
# repository: a range here would let the thing that fixed a supply-chain advisory drift on the next
# install without any commit saying so. Re-check with `pnpm audit --audit-level moderate` after any
# toolchain bump, and delete an override that has become unnecessary rather than leaving it to rot.
overrides:
  # Six advisories: WebSocket memory exhaustion (GHSA-vrm6-8vpv-qv8q), an unhandled exception in the
  # WebSocket client (GHSA-v9p9-hfj2-hcw8), request/response smuggling, an unbounded decompression
  # chain, CRLF injection via `upgrade`, and Set-Cookie header injection.
  undici: 6.28.0
  # Code injection via `_.template` import key names, plus two prototype-pollution advisories.
  lodash-es: 4.18.1
  # A crafted ZIP triggers a 4 GB allocation.
  adm-zip: 0.6.0

  # ── Arriving through the wallet stack, all of them development-and-browser transitive ────────
  #
  # RainbowKit pulls @wagmi/connectors, which pulls @base-org/account, which pulls
  # @coinbase/cdp-sdk. Three packages deep, none of them chosen by Kyrve, and all three carry
  # published fixes. Pulled forward rather than excused, and pinned to the SAME MAJOR wherever the
  # fix exists there: a major bump on a transitive dependency changes an API for a consumer that
  # never asked for it.
  #
  # Ten advisories in axios, covering SSRF through absolute-URL handling, a DoS through unbounded
  # response decompression, and an HTTP/2 upload path that bypasses maxBodyLength.
  axios: 1.19.0
  # Two in ws: a DoS through unbounded header counts, and a request-smuggling path.
  ws: 8.21.1
  # One in uuid. 11.1.1 is the fix inside the major the wallet stack already depends on; 14.x is
  # available and would be a two-major jump for a consumer that pinned 11.
  uuid: 11.1.1
